<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ashbi Saju — Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="1" stop-color="#12101f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.08" cy="1" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glowA)"/>
    <rect width="1200" height="300" fill="url(#glowB)"/>

    <!-- constellation, echoing the portfolio background -->
    <g stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1">
      <line x1="880" y1="70" x2="960" y2="110"/><line x1="960" y1="110" x2="1050" y2="80"/>
      <line x1="960" y1="110" x2="1010" y2="190"/><line x1="1010" y1="190" x2="1110" y2="210"/>
      <line x1="1050" y1="80" x2="1130" y2="130"/><line x1="1130" y1="130" x2="1110" y2="210"/>
    </g>
    <g fill="#c4b5fd">
      <circle cx="880" cy="70" r="3"/><circle cx="960" cy="110" r="4"/><circle cx="1050" cy="80" r="3"/>
      <circle cx="1010" cy="190" r="3"/><circle cx="1110" cy="210" r="4"/><circle cx="1130" cy="130" r="3"/>
    </g>
    <g fill="#67e8f9"><circle cx="960" cy="110" r="1.6"/><circle cx="1110" cy="210" r="1.6"/></g>

    <!-- status pill -->
    <g transform="translate(72 58)">
      <rect width="268" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="20" cy="16" r="5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="21" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#e5e7eb">Open to internships &amp; full-time roles</text>
    </g>

    <text x="70" y="168" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Ashbi Saju<tspan fill="#8b5cf6">.</tspan></text>

    <text x="72" y="212" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#d1d5db">Software Developer · Backend &amp; Full-Stack · Applied AI</text>
    <text x="72" y="248" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9ca3af">MCA @ Rajagiri College of Social Sciences  ·  Kochi, Kerala</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
